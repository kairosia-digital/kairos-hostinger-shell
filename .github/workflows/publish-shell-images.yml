name: Publish Kairós Hostinger Shell Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kairos-hostinger-shell (Odoo 19 + Bootstrapper)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kairosia-digital/kairos-hostinger-shell:19.0
            ghcr.io/kairosia-digital/kairos-hostinger-shell:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kairos-hostinger-vpn (WireGuard / Tailscale)
        uses: docker/build-push-action@v6
        with:
          context: ./vpn
          file: ./vpn/Dockerfile
          push: true
          tags: |
            ghcr.io/kairosia-digital/kairos-hostinger-vpn:19.0
            ghcr.io/kairosia-digital/kairos-hostinger-vpn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kairos-hostinger-mail (Local Postfix + Dovecot Ingestion)
        uses: docker/build-push-action@v6
        with:
          context: ./mail
          file: ./mail/Dockerfile
          push: true
          tags: |
            ghcr.io/kairosia-digital/kairos-hostinger-mail:19.0
            ghcr.io/kairosia-digital/kairos-hostinger-mail:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
